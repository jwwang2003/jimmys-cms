# Lives at /etc/nginx/sites-available/cms on the droplet (do0), enabled via a
# symlink in sites-enabled. The droplet already fronts every site with nginx +
# certbot, so the CMS follows that pattern rather than the Caddy alternative
# kept in deploy/Caddyfile.
#
# Every portal hostname is served directly by this one block. Sessions are
# per-domain (a browser rule — the portals sit on different registrable
# domains, so no cookie can span them): each portal gets its own independent
# login, which is the accepted tradeoff of multi-portal serving.
#
# Adding portal N+1 is four edits, none of them here beyond the name list:
#   1. DNS: point cms.<new-domain> at this droplet (Cloudflare proxied is fine)
#   2. append the hostname to BOTH server_name lines below
#   3. re-run certbot listing EVERY name (it expands the one cert):
#        sudo certbot --nginx --expand -d cms.jwwang.ca -d cms.glorialan.com -d cms.<new-domain>
#   4. append https://cms.<new-domain> to AUTH_TRUSTED_ORIGINS in
#      /opt/jimmys-cms/.env, then: docker compose up -d cms
#   5. add https://cms.<new-domain> to the masters bucket's CORS
#      AllowedOrigins (uploads are presigned PUTs from the browser)
#   (then: sudo nginx -t && sudo systemctl reload nginx)
#
# This is the pre-certificate bootstrap form: plain port 80. Run
#   sudo certbot --nginx -d cms.jwwang.ca -d cms.glorialan.com
# afterwards and certbot rewrites the block with the 443/ssl listeners,
# exactly like the existing jwwang.ca and glorialan.com vhosts.

server {
    listen 80;
    listen [::]:80;
    server_name cms.jwwang.ca cms.glorialan.com;

    # The multipart proxy route parses spreadsheets server-side; large camera
    # originals bypass nginx entirely via presigned PUTs straight to R2.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Batch-import progress is a Server-Sent Events stream; response buffering
    # would hold events back until the buffer fills, which defeats the stream.
    location ~ ^/api/admin/media/batch-import/.+/events$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
