# Lives at /etc/nginx/sites-available/cms.jwwang.ca on the droplet (do0),
# enabled via a symlink in sites-enabled. The droplet already fronts every site
# with nginx + certbot, so the CMS follows that pattern rather than the Caddy
# alternative kept in deploy/Caddyfile.
#
# This is the pre-certificate bootstrap form: plain port 80. Run
#   sudo certbot --nginx -d cms.jwwang.ca -d cms.glorialan.com
# afterwards and certbot rewrites these blocks with the 443/ssl listeners,
# exactly like the existing jwwang.ca and glorialan.com vhosts.

server {
    listen 80;
    listen [::]:80;
    server_name cms.jwwang.ca;

    # The multipart proxy route parses spreadsheets server-side; large camera
    # originals bypass nginx entirely via presigned PUTs straight to R2.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Batch-import progress is a Server-Sent Events stream; response buffering
    # would hold events back until the buffer fills, which defeats the stream.
    location ~ ^/api/admin/media/batch-import/.+/events$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}

# One canonical hostname (cms-plan.md §5.1): session cookies are per-domain, so
# serving both names directly would mean two independent login states for one
# admin panel. The redirect keeps "both URLs work" with a single session domain.
server {
    listen 80;
    listen [::]:80;
    server_name cms.glorialan.com;
    return 301 https://cms.jwwang.ca$request_uri;
}
