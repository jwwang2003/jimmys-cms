# Lives at /opt/jimmys-cms/docker-compose.yml on the droplet.
# The deploy workflow rewrites IMAGE_TAG in .env and runs `docker compose up -d`.
services:
  cms:
    image: ${IMAGE}:${IMAGE_TAG:-latest}
    container_name: jimmys-cms
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SQLITE_URL: /data/sqlite.db
    volumes:
      - cms-data:/data
      # Next's build cache. Without a volume it is rebuilt from cold on every
      # container replacement, which a stop-start deploy does every time.
      - cms-next-cache:/app/.next/cache
    # Bound to loopback: the reverse proxy terminates TLS and forwards here.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Continuous replication of the SQLite file to R2.
  #
  # The catalog is as irreplaceable as the masters and is the one piece of state
  # a container replacement cannot rebuild, so this runs from day one rather
  # than being added after the first loss. Litestream ships the WAL, so recovery
  # is to the last few seconds rather than to the last snapshot.
  #
  # It shares the volume with the CMS rather than running as a sidecar over the
  # network: SQLite replication requires filesystem access to the database and
  # its WAL.
  litestream:
    image: litestream/litestream:0.3
    container_name: jimmys-cms-litestream
    restart: unless-stopped
    # Enabled by setting COMPOSE_PROFILES=backup in /opt/jimmys-cms/.env once
    # the backups bucket + token exist. Without the profile, `docker compose
    # up -d` skips this service instead of crash-looping on empty credentials.
    profiles: ["backup"]
    depends_on:
      - cms
    env_file:
      - .env
    volumes:
      - cms-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    command: replicate -config /etc/litestream.yml

volumes:
  cms-data:
  cms-next-cache:
